apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatos-deployment
  labels:
    app: gatos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gatos
  template:
    metadata:
      labels:
        app: gatos
    spec:
      containers:
        - name: gatos
          image: ghcr.io/samuelleonv/kubernetegatosdemo:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
